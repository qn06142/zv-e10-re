# Sony ZV-E10 Open Gate Configuration
# Located at: /setting/opengate.conf

# Master switch: 1 = enable in-memory patch, 0 = disable (stock behavior)
enable=1

# Aspect Ratio Mode (DefStruct::MOVIE_ASPECT_*):
# 0 = 4:3 (Anamorphic Video)
# 1 = 16:9 (Stock Video)
# 2 = 3:2 (Open Gate Full Sensor Readout - 6000x4000)
# 3 = 1:1 (Square Video)
# 4 = 17:9 (DCI Cinema)
aspect=2
